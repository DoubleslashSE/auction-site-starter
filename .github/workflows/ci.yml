name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:api
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "true"
      - name: Container image builds and serves the site
        run: |
          docker build -t site .
          docker run -d --name site -p 127.0.0.1:8088:80 -e SITE_AUTHORITY=https://id.example.com/realms/acme -e SITE_API=https://api.example.com/api/v1 -e SITE_TENANT=acme site
          sleep 2
          curl -fsS http://127.0.0.1:8088/config.js | grep -q 'tenant: "acme"'
          curl -fsS -D - http://127.0.0.1:8088/lots/1 | grep -qi "^content-security-policy: default-src 'self'; script-src 'self'; connect-src 'self' https://id.example.com https://api.example.com"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  image:
    # A container image per release tag: nginx serving the site, config.js from environment variables.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/doubleslashse/auction-site-starter:${{ github.ref_name }}
